<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>MagMe - Magma Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0a0a;
    --surface: #131313;
    --surface-2: #1a1a1a;
    --border: #232323;
    --border-strong: #2e2e2e;
    --text: #f5f5f5;
    --muted: #7a7a7a;
    --muted-2: #555;
    --accent: #f5f5f5;
    --radius: 10px;
    --radius-lg: 14px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    line-height: 1.5;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.container {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 32px;
}

.lang-switch {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    z-index: 100;
}
.lang-btn {
    padding: 5px 10px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
}
.lang-btn.active {
    background: var(--surface-2);
    color: var(--text);
}

.header { text-align: center; }
.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
}
.tagline {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 500;
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
}
.card-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
}
.card-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
}

.field { margin-bottom: 20px; }
.field-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-bottom: 8px;
}
.field-value {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.5;
    min-height: 44px;
    display: flex;
    align-items: center;
}
.field-value.empty { color: var(--muted-2); font-style: italic; }
.field-value.skeleton {
    color: transparent;
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--bg);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    min-height: 48px;
}
.btn:hover:not(:disabled) { opacity: 0.9; }
.btn:active:not(:disabled) { transform: scale(0.99); }
.btn:disabled {
    background: var(--surface-2);
    color: var(--muted-2);
    cursor: not-allowed;
}

.status {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 12px;
    display: none;
    line-height: 1.5;
}
.status.show { display: block; }
.status.error {
    background: rgba(255, 70, 70, 0.08);
    border: 1px solid rgba(255, 70, 70, 0.2);
    color: #ff6b6b;
}

.footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted-2);
    letter-spacing: 0.3px;
}

@media (min-width: 768px) {
    .lang-switch { top: 24px; right: 24px; }
}
</style>
</head>
<body>

<div class="lang-switch" role="group" aria-label="Language">
    <button class="lang-btn" data-lang="en" type="button">EN</button>
    <button class="lang-btn active" data-lang="th" type="button">TH</button>
</div>

<div class="container">
    <header class="header">
        <div class="logo">MagMe</div>
        <p class="tagline" data-i18n="tagline">Magma Board</p>
    </header>

    <main class="card">
        <h1 class="card-title" data-i18n="title">Magma Board</h1>
        <p class="card-desc" data-i18n="desc">Join the board to share ideas and connect with the community.</p>

        <div class="field">
            <div class="field-label" data-i18n="linkLabel">Board Link</div>
            <div id="linkUrl" class="field-value skeleton" data-i18n="loading">Loading...</div>
        </div>

        <button id="joinBtn" class="btn" disabled>
            <span data-i18n="loading">Loading...</span>
        </button>

        <div id="statusMsg" class="status" role="alert"></div>
    </main>

    <footer class="footer">
        <p>2026 IMC72S</p>
    </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";

const firebaseConfig = {
    apiKey: "AIzaSyCMMylQkR6XQsedKc59zCIwx_ATscEyjXM",
    authDomain: "datplub.firebaseapp.com",
    databaseURL: "https://datplub-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "datplub",
    storageBucket: "datplub.firebasestorage.app",
    messagingSenderId: "556089815854",
    appId: "1:556089815854:web:f586ba96371a51c386c0bf",
    measurementId: "G-CLZYY4CHS1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

isSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});

const I18N = {
    th: {
        tagline: "แมกม่า บอร์ด",
        title: "แมกม่า บอร์ด",
        desc: "เข้าร่วมบอร์ดเพื่อแชร์ไอเดียและเชื่อมต่อกับชุมชน",
        linkLabel: "ลิงก์บอร์ด",
        loading: "กำลังโหลด...",
        join: "เข้าร่วมเลย",
        waiting: "รอการอัปเดต",
        noLink: "ยังไม่มีลิงก์ กรุณารอการอัปเดต",
        loadError: "ไม่สามารถโหลดลิงก์ได้",
        error: "เกิดข้อผิดพลาด กรุณาลองใหม่ภายหลัง"
    },
    en: {
        tagline: "Magma Board",
        title: "Magma Board",
        desc: "Join the board to share ideas and connect with the community.",
        linkLabel: "Board Link",
        loading: "Loading...",
        join: "Join Now",
        waiting: "Waiting for update",
        noLink: "No link available yet. Please wait for an update.",
        loadError: "Unable to load link",
        error: "Something went wrong. Please try again later."
    }
};

let currentLang = localStorage.getItem("magme_lang") || "th";
let currentUrl = "";
let linkState = "loading";

const linkUrlEl = document.getElementById("linkUrl");
const joinBtn = document.getElementById("joinBtn");
const statusMsg = document.getElementById("statusMsg");

function applyLang(lang) {
    currentLang = lang;
    localStorage.setItem("magme_lang", lang);
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];
    });
    document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
    });
    render();
}

function render() {
    const t = I18N[currentLang];

    if (linkState === "loading") {
        linkUrlEl.textContent = t.loading;
        linkUrlEl.className = "field-value skeleton";
        joinBtn.disabled = true;
        joinBtn.textContent = t.loading;
    } else if (linkState === "ready") {
        linkUrlEl.textContent = currentUrl;
        linkUrlEl.className = "field-value";
        joinBtn.disabled = false;
        joinBtn.textContent = t.join;
    } else if (linkState === "empty") {
        linkUrlEl.textContent = t.noLink;
        linkUrlEl.className = "field-value empty";
        joinBtn.disabled = true;
        joinBtn.textContent = t.waiting;
    } else if (linkState === "error") {
        linkUrlEl.textContent = t.loadError;
        linkUrlEl.className = "field-value empty";
        joinBtn.disabled = true;
        joinBtn.textContent = t.loadError;
        showStatus(t.error);
    }
}

function showStatus(msg) {
    statusMsg.textContent = msg;
    statusMsg.className = "status show error";
    setTimeout(() => statusMsg.classList.remove("show"), 5000);
}

document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => applyLang(btn.dataset.lang));
});

joinBtn.addEventListener("click", () => {
    if (currentUrl && /^https?:\/\//i.test(currentUrl)) {
        window.open(currentUrl, "_blank", "noopener,noreferrer");
    }
});

const boardRef = ref(db, "settings/board");
onValue(boardRef,
    (snapshot) => {
        const data = snapshot.val();
        if (data && data.url) {
            currentUrl = data.url;
            linkState = "ready";
        } else {
            currentUrl = "";
            linkState = "empty";
        }
        render();
    },
    (err) => {
        console.error("Database error:", err);
        linkState = "error";
        render();
    }
);

applyLang(currentLang);
</script>
</body>
</html>
